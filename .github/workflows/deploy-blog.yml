name: Build and deploy static blog

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options:
          - preview
          - production
        default: preview
        required: true
      bind_domain:
        description: Bind avnpc.com to the production Pages project
        type: boolean
        default: false
        required: false

concurrency:
  group: avnpc-blog-${{ inputs.target || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Check out blog content
        uses: actions/checkout@v4
        with:
          repository: AlloVince/avnpc.content
          ref: master
          path: avnpc.content

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build static blog
        run: pnpm --dir web build
        env:
          CONTENT_ROOT: ${{ github.workspace }}/avnpc.content/source
          NEXT_PUBLIC_GITALK_CLIENT_ID: ${{ vars.GITALK_CLIENT_ID }}
          NEXT_PUBLIC_GITALK_OAUTH_PROXY: ${{ vars.GITALK_OAUTH_PROXY }}

      - name: Check Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Actions variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing Actions variable CLOUDFLARE_PAGES_PROJECT"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4.136.3 pages deploy web/out --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CF_PAGES_BRANCH: ${{ inputs.target == 'production' && 'master' || format('preview-{0}', github.run_number) }}

      - name: Bind avnpc.com to Cloudflare Pages
        if: ${{ inputs.bind_domain && inputs.target == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT/domains"
          domains="$(curl --fail-with-body --silent --show-error "$endpoint" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if jq -e --arg domain "avnpc.com" '.result[]? | select(.name == $domain)' >/dev/null <<< "$domains"; then
            jq --arg domain "avnpc.com" '{success, domain: [.result[] | select(.name == $domain) | {name, status, validation_data}]}' <<< "$domains"
            exit 0
          fi
          response="$(curl --fail-with-body --silent --show-error --request POST "$endpoint" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"name":"avnpc.com"}')"
          jq -e '.success == true' >/dev/null <<< "$response"
          printf '%s\n' "$response" | jq '{success, errors, result: {name: .result.name, status: .result.status, validation_data: .result.validation_data}}'
